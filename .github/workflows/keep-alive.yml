name: Keep Render instance warm

# Render's free tier spins the service down after ~15 minutes idle, so the next real visitor
# eats a cold start. This just curls the public health endpoint on a schedule to keep it warm.
# It does not build, test, or deploy anything.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Curl the deployed health endpoint
        run: |
          # --max-time 90: a genuine Render free-tier cold start has been observed taking ~49s —
          # 30s was too short and gave up before the ping could actually do its one job (waking
          # the instance). `|| status=000` is required: GitHub Actions runs this script under
          # `set -e`, and `status=$(curl ...)` with a failing/timed-out curl aborts the script
          # right there — before the warning logic below ever runs — turning an expected
          # "still cold-starting" ping into a hard job failure (and an email) instead of the
          # intended quiet warning. This step must never fail the job on its own; only an actual
          # workflow-syntax error should.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://flow-ops.onrender.com/health || echo 000)
          echo "Health endpoint responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            echo "::warning::Health check did not return 200 (got $status) — instance may still be cold-starting."
          fi
          exit 0
