name: FlowOps CI

# CLAUDE.md §18: restore -> build -> test -> vulnerability scan -> container build, then (second
# job) API checks against the running container, on every push and PR against main. No deployment
# here — Render is connected directly to this repo and builds the Dockerfile itself
# (dashboard-managed); there is no deploy.yml. Render's Auto-Deploy "After CI Checks Pass" setting
# is what makes a failed job here block a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global-json-file, not a hardcoded dotnet-version input, so this workflow always matches
      # whatever SDK the repository itself declares (global.json) rather than drifting from it.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FlowOps.sln

      # CLAUDE.md §18: "dotnet format --verify-no-changes" — the exact gate the contract names.
      - name: Verify formatting
        run: dotnet format FlowOps.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FlowOps.sln --no-restore

      # Phase 30A: FlowOps.E2E.Tests drives a real Chromium against the real (Kestrel) app —
      # Microsoft.Playwright ships its own browser binaries (not a Node/npm toolchain, CLAUDE.md
      # §11.1) but they still need a one-time install; playwright.ps1 is generated into the test
      # project's own build output, and runs under pwsh (preinstalled on GitHub-hosted runners)
      # regardless of OS.
      - name: Install Playwright browsers
        run: pwsh tests/FlowOps.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # FlowOps.Application.Tests and FlowOps.Web.Tests provision real PostgreSQL via
      # Testcontainers (CLAUDE.md §15 — no in-memory/SQLite substitute). FlowOps.E2E.Tests does the
      # same for its own real-browser run. The ubuntu-latest runner has Docker preinstalled and
      # running, which is all Testcontainers needs; no service container, wait-script, or test-code
      # change is introduced here.
      - name: Test
        run: dotnet test FlowOps.sln --no-build

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      # dotnet-ef is not part of the SDK and has no tool manifest in this repo, so it is installed
      # here rather than assumed present. Pinned to match the EF Core package version used
      # throughout the solution (src/FlowOps.Infrastructure/FlowOps.Infrastructure.csproj).
      - name: Install EF Core CLI tool
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Confirmed to require no live database connection: this is a design-time comparison of the
      # compiled model against the last migration's snapshot, not a query against a real server.
      - name: Check for pending EF model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/FlowOps.Infrastructure/FlowOps.Infrastructure.csproj
          --startup-project src/FlowOps.Infrastructure/FlowOps.Infrastructure.csproj

      # Proves the existing production Dockerfile still builds on every commit (CLAUDE.md §18) —
      # no separate CI-only Dockerfile, and no push to any registry (Render builds this same
      # Dockerfile itself; there is no separate deploy workflow).
      - name: Build container image
        run: docker build -t flowops-web:ci .

  # The deploy gate: real HTTP calls against the real container, run only after the build/test job
  # above has passed. Starts the same docker-compose stack documented for local development (app +
  # PostgreSQL, demo data seeded on first start), then runs tests/FlowOps.ApiChecks - health,
  # login, role-based page access, authorization boundaries, a ticket create round-trip, and the
  # login rate limit. Any failing check fails this job; with Render's Auto-Deploy set to "After CI
  # Checks Pass", that is what stops a broken build from being deployed.
  api-checks:
    name: API checks against the built container
    runs-on: ubuntu-latest
    needs: ci

    env:
      FLOWOPS_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start the app and database
        run: docker compose up -d --build

      # The container applies migrations and seeds the demo organization before it starts
      # listening, so /health only answers once that has finished. Poll with a generous ceiling.
      - name: Wait for the app to be healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "$FLOWOPS_BASE_URL/health" > /dev/null 2>&1; then
              echo "App healthy after ~$((attempt * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy within 300s"
          exit 1

      - name: Run API checks
        run: dotnet test tests/FlowOps.ApiChecks/FlowOps.ApiChecks.csproj --logger "console;verbosity=normal"

      - name: Show app logs
        if: failure()
        run: docker compose logs app

      - name: Stop the stack
        if: always()
        run: docker compose down -v
